openapi: 3.0.0
info:
  title: Race Car API
  description: Real-time slot car race data powered by Confluent Cloud
  version: 1.0.0
servers:
  - url: https://race-api.2b32cyjq3oou.us-south.codeengine.appdomain.cloud
    description: IBM Code Engine
paths:
  /standings:
    get:
      operationId: get_standings
      summary: Get current race standings
      description: >
        Returns live standings for all cars including total laps completed,
        best lap time in milliseconds, current fuel percentage, and current position.
        Use this to answer questions like "who is winning?", "who has the fastest lap?",
        or "what is the fuel level of car X?".
      responses:
        '200':
          description: List of car standings ordered by total laps descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarStanding'
  /lap-history:
    get:
      operationId: get_lap_history
      summary: Get full lap history for all cars
      description: >
        Returns every individual lap recorded for all cars, ordered by car then lap number.
        Each entry includes the lap time, fuel level at that lap, and race position.
        Use this to answer questions like "is car X improving?", "what is car X's average lap time?",
        "how fast is fuel draining for car X?", or "which car has been most consistent?".
      responses:
        '200':
          description: List of lap records ordered by car_id then lap number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LapRecord'
  /fuel-alerts:
    get:
      operationId: get_fuel_alerts
      summary: Get recent low fuel alerts
      description: >
        Returns recent events where a car's fuel level dropped below 25%.
        Use this to answer questions like "which cars are running low on fuel?"
        or "when did car X last trigger a fuel warning?".
      responses:
        '200':
          description: List of recent fuel alerts, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelAlert'
components:
  schemas:
    CarStanding:
      type: object
      properties:
        car_id:
          type: string
          description: Car slot number (1-6)
        total_laps:
          type: integer
          description: Total number of laps completed
        best_lap_ms:
          type: number
          description: Best (fastest) lap time in milliseconds
        latest_fuel_pct:
          type: number
          description: Most recent fuel level as a percentage (0-100)
        latest_position:
          type: string
          description: Current race position
    LapRecord:
      type: object
      properties:
        car_id:
          type: string
          description: Car slot number (1-6)
        lap:
          type: integer
          description: Lap number
        lap_time_ms:
          type: number
          description: Lap time in milliseconds
        fuel_pct:
          type: number
          description: Fuel percentage at the end of this lap
        position:
          type: string
          description: Race position at the end of this lap
        timestamp:
          type: string
          description: ISO 8601 timestamp of the lap crossing
    FuelAlert:
      type: object
      properties:
        car_id:
          type: string
          description: Car slot number that triggered the alert
        fuel_pct:
          type: number
          description: Fuel percentage at the time of the alert
        at_lap:
          type: integer
          description: Lap number when the alert was triggered
        event_time:
          type: string
          description: ISO 8601 timestamp of the alert
